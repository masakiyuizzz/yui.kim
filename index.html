<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yui.kim - 主页</title>
    <meta name="description" content="真咲唯的秘密基地入口，个人导航主页">
    
    <link rel="icon" type="image/png" href="/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Yui" />
    <link rel="manifest" href="/my-favicon/site.webmanifest" />
    
    <link rel="stylesheet" href="css/style.css?v=1.0">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="title-prefix">&gt; </span>
                <span class="title-text" id="typingText"></span>
                <span class="cursor" aria-hidden="true">_</span>
            </h1>
            <p class="description">
                欢迎回家，这里是真咲唯的秘密基地入口<br>
                本页面作为浏览器自定义主页使用，记录了我的在线空间导航
            </p>
        </header>

        <section class="search-section" aria-label="搜索">
            <div class="search-container">
                <span class="search-prefix" aria-hidden="true">&gt;</span>
                <input 
                    type="search" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="输入搜索内容..."
                    autocomplete="off"
                    aria-label="搜索内容"
                >
                <button class="search-btn" id="searchBtn" aria-label="执行搜索">
                    搜索
                </button>
            </div>
            <div class="search-hint">
                <span class="hint-text">// 按 Enter 键搜索，使用 Bing 搜索</span>
            </div>
        </section>

        <main id="cardsContainer" aria-label="导航卡片">
        </main>

        <footer class="footer">
            <p class="footer-text">
                <span class="comment">// </span>&copy; 2026 yui.kim. All rights reserved.
            </p>
            <p class="footer-text">
                <span class="comment">// </span>Built with obsession by 真咲唯 | <a href="https://yui.kim" class="footer-link" target="_blank" rel="noopener">yui.kim</a>
            </p>
            <p class="footer-text">
                <span class="comment">// </span>Designed in `放課後ティータイム`. Deployed with afternoon tea.
            </p>
            <p class="footer-text">
                <span class="comment">// </span>Email: <a href="mailto:masakiyui@163.com" class="footer-link" title="邮件联系">masakiyui@163.com</a>
                <span class="comment">| </span>GitHub: <a href="https://github.com/masakiyuizzz/yui.kim" class="footer-link" target="_blank" rel="noopener" title="本页面Github代码">github.com/masakiyuizzz/yui.kim</a>
            </p>
        </footer>
    </div>

    <script src="js/config.js?v=1.0" defer></script>
    <script src="js/search.js?v=1.0" defer></script>
    <script src="js/typing.js?v=1.0" defer></script>
    <script src="js/cards.js?v=1.0" defer></script>
    <script src="js/lazy-load.js?v=1.0" defer></script>
    <script src="js/main.js?v=1.0" defer></script>
</body>
</html>
